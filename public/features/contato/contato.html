<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
 <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Times New Roman", Times, serif;
      background-color: #f4f4f4;
      color: #333;
      height: 100vh;
      overflow-x: hidden;
    }
    #menu-toggle {
      display: none;
    }
    .menu-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 30px;
      height: 22px;
      cursor: pointer;
      z-index: 1100;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .menu-btn span {
      display: block;
      height: 3px;
      width: 100%;
      background-color: #fff;
      border-radius: 3px;
      transition: 0.3s;
    }
    .slide-menu {
      position: fixed;
      top: 0;
      left: -260px;
      width: 260px;
      height: 100vh;
      background: rgb(199, 100, 8);
      color: white;
      transition: left 0.3s ease;
      padding-top: 60px;
      z-index: 1090;
      border-radius: 0 10px 10px 0;
      display: flex;
      flex-direction: column;
    }
    .slide-menu .close-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      font-size: 28px;
      cursor: pointer;
      user-select: none;
      color: white;
      font-weight: bold;
      line-height: 1;
    }
    .slide-menu ul {
      list-style: none;
      padding: 0;
      margin-top: 40px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }
    .slide-menu li {
      padding: 20px 30px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 18px;
      cursor: pointer;
      transition: background 0.3s ease;
      flex-grow: 0;
    }
    .slide-menu li:hover {
      background: rgb(250, 126, 10);
      color: white;
    }
    .slide-menu a {
      color: white;
      text-decoration: none;
      display: block;
      width: 100%;
      height: 100%;
    }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1080;
    }
    #menu-toggle:checked ~ .slide-menu {
      left: 0;
    }
    #menu-toggle:checked ~ .overlay {
      opacity: 1;
      pointer-events: auto;
    }
    #menu-toggle:checked + .menu-btn span:nth-child(1) {
      transform: rotate(45deg) translateY(8px);
      background: white;
    }
    #menu-toggle:checked + .menu-btn span:nth-child(2) {
      opacity: 0;
    }
    #menu-toggle:checked + .menu-btn span:nth-child(3) {
      transform: rotate(-45deg) translateY(-8px);
      background: white;
    }
    header {
      background-color: rgb(199, 100, 8);
      color: white;
      padding: 25px 20px;
      text-align: center;
      font-weight: bold;
      font-size: 28px;
      letter-spacing: 1px;
      margin-left: 0;
      transition: margin-left 0.3s ease;
    }
    header p {
      font-weight: normal;
      font-size: 16px;
      margin-top: 8px;
      color: #d0c0d0;
    }
    section {
      max-width: 700px;
      margin: 40px auto 60px auto;
      background: white;
      padding: 30px 40px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      border-radius: 10px;
      line-height: 1.6;
      font-size: 18px;
      transition: margin-left 0.3s ease;
    }
    label, input, textarea {
      display: block;
      width: 100%;
      margin-bottom: 15px;
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      color: #333;
    }
    input, textarea {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
    }
    button {
      background-color: rgb(199, 100, 8);
      color: white;
      padding: 12px 25px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
      transition: background-color 0.3s ease;
      font-family: "Times New Roman", Times, serif;
    }
    button:hover {
      background-color: #f89007;
    }
    #menu-toggle:checked ~ header,
    #menu-toggle:checked ~ section {
      margin-left: 260px;
    }
    @media(max-width: 600px) {
      .slide-menu {
        width: 200px;
        left: -200px;
        border-radius: 0 8px 8px 0;
      }
      #menu-toggle:checked ~ header,
      #menu-toggle:checked ~ section {
        margin-left: 200px;
      }
      .slide-menu li {
        padding: 15px 20px;
        font-size: 14px;
      }
      .menu-btn {
        top: 15px;
        left: 15px;
        width: 26px;
        height: 18px;
      }
      header {
        font-size: 24px;
        padding: 20px 15px;
      }
      section {
        padding: 20px 25px;
        font-size: 16px;
      }
      .slide-menu .close-btn {
        font-size: 24px;
        top: 12px;
        left: 12px;
      }
    }
  </style>
<body>

  <nav class="slide-menu" role="navigation" aria-label="Menu principal">

    </ul>
  </nav>

  <div class="overlay"></div>

  <header>

    <p>Envie sua mensagem e responderemos em breve</p>
  </header>

  <section>
